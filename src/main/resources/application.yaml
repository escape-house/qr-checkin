ktor:
  deployment:
    port: "$KTOR_PORT:8080"

  application:
    modules:
      - at.escapehouse.MainKt.configureWebSockets
      - at.escapehouse.auth.AdminAuthKt.configureAdminAuth
      - at.escapehouse.routing.RoutingKt.configureRouting
      - at.escapehouse.MainKt.configureSerialization
      - at.escapehouse.MainKt.configureErrorHandling
      - at.escapehouse.MainKt.configureCors

    dependencies:
      - at.escapehouse.service.HttpClientKt.provideHttpClient
      - at.escapehouse.config.QuinbookConfigKt.provideQuinbookConfig
      - at.escapehouse.config.MongoConfigKt.provideMongoConfig
      - at.escapehouse.config.MongoConfigKt.provideMongoDatabase
      - at.escapehouse.repository.MongoCheckInRepositoryImpl
      - at.escapehouse.service.QuinbookService
      - at.escapehouse.service.QuinbookAuth
      - at.escapehouse.service.DashboardBroadcaster
      - at.escapehouse.service.CheckInService
      - at.escapehouse.service.AdminRegistrationService

admin:
  password: "$ADMIN_PASSWORD"
  sessionSignKey: "$ADMIN_SESSION_SIGN_KEY"
  secureCookie: "$ADMIN_SECURE_COOKIE:false"

quinbook:
  clientId: "$QUINBOOK_CLIENT_ID"
  clientSecret: "$QUINBOOK_CLIENT_SECRET"
  baseUrl: "$QUINBOOK_BASE_URL:https://api2.quinbook.com"

mongodb:
  connectionString: "$MONGODB_CONNECTION_STRING"
  database: "$MONGODB_DATABASE:escape-house"