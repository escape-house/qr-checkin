services:
  mongodb:
    image: ghcr.io/fenio/mongodb-no-avx:7
    container_name: qr-checkin-mongo
    restart: unless-stopped
    volumes:
      - qr-checkin-mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/27017'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  check-in:
    image: ghcr.io/escape-house/qr-checkin:v0.0.4
    container_name: qr-checkin-app
    restart: unless-stopped
    environment:
      TZ: Europe/Vienna
    env_file:
      - path: .env
        required: true # default
    depends_on:
      mongodb:
        condition: service_healthy

    ports:
      - "7070:8080"

volumes:
  qr-checkin-mongodb-data:
